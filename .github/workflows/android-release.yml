name: Build & Auto-Deploy KHADAMATY (GitHub Pages + Android APK)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-encrypted-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix Git Safe Directory for Flutter SDK
        run: git config --global --add safe.directory '*'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Analyze & Build Web (GitHub Pages) + Android Release
        run: |
          flutter create --org com.khadamaty.official --project-name khadamaty_app --platforms android,web build_app
          rm -rf build_app/lib/*
          cp -r mobile_app/lib/* build_app/lib/
          rm -rf build_app/test
          cd build_app
          flutter pub add http
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          sed -i 's/<head>/<head><link href="https:\/\/fonts.googleapis.com\/css2?family=Cairo:wght@400;700;900\&display=swap" rel="stylesheet">/g' web/index.html
          flutter build web --release --base-href "/KHADAMATY/" --no-tree-shake-icons
          touch build/web/.nojekyll
          cp build/web/index.html build/web/404.html
          flutter build apk --release --obfuscate --split-debug-info=./debug_symbols --no-tree-shake-icons
          flutter build appbundle --release --obfuscate --split-debug-info=./debug_symbols --no-tree-shake-icons

      - name: Auto-Deploy Website to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build_app/build/web
          force_orphan: true
          commit_message: "Auto-deploy KHADAMATY Web to GitHub Pages"

      - name: Upload Website Artifact Backup
        uses: actions/upload-artifact@v4
        with:
          name: khadamaty-encrypted-website
          path: build_app/build/web

      - name: Upload Encrypted Android APK
        uses: actions/upload-artifact@v4
        with:
          name: khadamaty-encrypted-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Encrypted Google Play Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: khadamaty-encrypted-playstore-aab
          path: build_app/build/app/outputs/bundle/release/app-release.aab